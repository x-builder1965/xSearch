<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>ダッシュボード</title>
</head>
<body>
    <div id="dashboard-container" class="dashboard-container">
        <!-- 上部エリア：サマリーカード -->
        <section class="dashboard-section summary-section">
            <div class="summary-card-header">
                <h2>サマリー</h2>
                <span id="summary-timestamp" class="summary-timestamp">----年--月--日(-) --:--時点</span>
            </div>
            <div class="summary-table-wrapper">
                <table class="summary-table">
                    <thead>
                        <tr>
                            <th>分類</th>
                            <th>シリーズ数</th>
                            <th>タイトル数</th>
                            <th>🟢:正常</th>
                            <th>🔴:不明</th>
                            <th>🟡:空</th>
                            <th>🟣:重複</th>
                            <th>🟩:正常</th>
                            <th>🟥:不明</th>
                            <th>🟨:空</th>
                            <th>🟪:重複</th>
                            <th>話数</th>
                        </tr>
                    </thead>
                    <tbody id="summary-table-body">
                        <!-- renderer_dashboard.js で動的生成 -->
                    </tbody>
                </table>
            </div>
        </section>
        <!-- 下部エリア：グループA・B（左右配置） -->
        <section class="dashboard-section stats-section">
            <!-- グループA（左側：分類統計カード ＋ 要素別件数カード を縦並び） -->
            <div class="dashboard-group-a">
                <!-- 分類統計カード -->
                <div class="stats-card category-stats-card">
                    <div class="card-header">
                        <h3 id="category-stats-title">分類統計（全て）</h3>
                        <div class="card-controls">
                            <select id="graph-shape-select" class="dash-select">
                                <option value="bar">棒グラフ</option>
                                <option value="line">折れ線グラフ</option>
                            </select>
                            <select id="period-unit-select" class="dash-select">
                                <option value="monthly">年月</option>
                                <option value="season">年シーズン</option>
                                <option value="year">単年</option>
                                <option value="5year">５年</option>
                                <option value="all">全年</option>
                            </select>
                            <div class="scale-control-wrapper">
                                <label for="category-scale-range">縮尺:</label>
                                <span id="category-scale-value">1.0x</span>
                                <input type="range" id="category-scale-range" min="1" max="12" step="1" value="1">
                            </div>
                            <select id="metric-type-select" class="dash-select">
                                <option value="rating">評価</option>
                                <option value="seriesKana">50音個別</option>
                                <option value="seriesKanaGroup">50音グループ</option>
                                <option value="genre">ジャンル</option>
                                <option value="viewCount">視聴回数</option>
                            </select>
                        </div>
                    </div>
                    <!-- 外側ラッパー：Y軸とスクロールエリアを横並びに保持する -->
                    <div class="category-chart-wrapper">
                        <!-- 左側に常時固定されるY軸エリア -->
                        <div class="category-chart-y-axis-fixed">
                            <canvas id="categoryChartYAxis"></canvas>
                        </div>
                        <!-- スクロールを司るメインのコンテナ -->
                        <div class="chart-container" id="category-chart-scroll-container">
                            <div class="category-chart-inner" id="category-chart-inner">
                                <canvas id="categoryChart"></canvas>
                            </div>
                        </div>
                        <!-- 右側に常時固定されるY軸エリア -->
                        <div class="category-chart-y-axis-fixed-right">
                            <canvas id="categoryChartYAxisRight"></canvas>
                        </div>
                    </div>
                </div>
                <!-- 要素別件数カード -->
                <div class="element-count-card">
                    <div id="element-card-title" class="element-count-title">要素別件数（----）</div>
                    <div id="element-total-count" class="element-total-count">全件数：0件</div>
                    <div id="element-scroll-container" class="element-scroll-container">
                        <!-- 動的生成される要素別件数リスト -->
                    </div>
                </div>
            </div>
            <!-- グループB（右側：選択期間の統計カード -->
            <div class="dashboard-group-b">
                <!-- 期間統計カード -->
                <div class="stats-card period-stats-card">
                    <div class="card-header">
                        <h3 id="period-stats-title">期間統計（選択された期間）</h3>
                    </div>
                    <div class="donut-charts-wrapper">
                        <!-- 上部中央：評価 -->
                        <div class="donut-row-center">
                            <div class="donut-chart-box" style="max-width: 50%;">
                                <div class="chart-title">評価</div>
                                <div class="canvas-box"><canvas id="ratingDonutChart"></canvas></div>
                            </div>
                        </div>
                        <!-- 中部横並び：50音 と ジャンル -->
                        <div class="donut-row-split">
                            <div class="donut-chart-box">
                                <div class="chart-title" id="series-kana-donut-title">50音</div>
                                <div class="canvas-box"><canvas id="seriesKanaDonutChart"></canvas></div>
                            </div>
                            <div class="donut-chart-box">
                                <div class="chart-title">ジャンル</div>
                                <div class="canvas-box"><canvas id="genreDonutChart"></canvas></div>
                            </div>
                        </div>
                        <!-- 下部中央：視聴回数 -->
                        <div class="donut-row-center">
                            <div class="donut-chart-box" style="max-width: 50%;">
                                <div class="chart-title">視聴回数</div>
                                <div class="canvas-box"><canvas id="viewCountDonutChart"></canvas></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </div>
</body>
</html>
